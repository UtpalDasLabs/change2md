[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "change2md"
version = "0.1.0"
description = "A secure remote MCP server that converts user-supplied files and webpages to Markdown."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "markitdown[pdf,docx,pptx,xlsx,xls,outlook]>=0.1.9,<0.2",
  "mcp>=2.1.1,<3",
  "requests>=2.32,<3",
  "uvicorn[standard]>=0.38,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/change2md_server"]

