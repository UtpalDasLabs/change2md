[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "change2md"
version = "0.2.0"
description = "Model-neutral file and webpage conversion for MCP clients, apps, CLIs, and SDKs."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "markitdown[pdf,docx,pptx,xlsx,xls,outlook]>=0.1.9,<0.2",
  "mcp>=2.1.1,<3",
  "python-multipart>=0.0.20,<1",
  "requests>=2.32,<3",
  "uvicorn[standard]>=0.38,<1",
]

[project.scripts]
change2md = "change2md_server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/change2md_server"]

[tool.vercel]
entrypoint = "src.change2md_server.app:app"

